<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ضيافة QA | منصة إدارة المطاعم والطلبات الذكية في قطر</title>

  <!-- الخطوط العربية والإنجليزية التحريرية الراقية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Tajawal:wght@500;700;800&amp;display=swap" rel="stylesheet">

  <!-- مكتبة Tailwind CSS للتصميم المتجاوب -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- مكتبة SheetJS (XLSX) لقراءة وتصدير ملفات Excel و CSV -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>

  <!-- مكتبة QRCode.js لتوليد رموز QR للطاولات -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Arabic"', '"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Tajawal"', '"IBM Plex Sans Arabic"', 'sans-serif'],
            latin: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            qatar: {
              maroon: '#8A1538',
              maroonDark: '#680E29',
              maroonLight: '#A91D47',
              sand: '#F7F4EF',
              sandDark: '#EBE5DC',
              stone: '#1C1917',
              stoneCard: '#262220',
              gold: '#B8860B',
              goldLight: '#D4A32B',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg-primary: #F7F4EF;
      --bg-secondary: #FFFFFF;
      --text-primary: #1C1917;
      --text-secondary: #57534E;
      --border-color: #E7E0D5;
    }

    html.dark {
      --bg-primary: #141211;
      --bg-secondary: #1E1B19;
      --text-primary: #F5F2EB;
      --text-secondary: #A8A29E;
      --border-color: #322D2A;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    /* خلفية هندسية متحركة مستوحاة من السدو القطري لواجهة المطعم بدون صور */
    .sadu-ambient-bg {
      background: linear-gradient(135deg, #5A0B23 0%, #8A1538 45%, #3B1621 100%);
      position: relative;
      overflow: hidden;
    }

    .sadu-ambient-bg::before {
      content: "";
      position: absolute;
      inset: -50%;
      background-image:
        radial-gradient(circle at 25% 25%, rgba(212, 163, 43, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 18px),
        repeating-linear-gradient(-45deg, rgba(212,163,43,0.04) 0px, rgba(212,163,43,0.04) 2px, transparent 2px, transparent 18px);
      animation: saduDrift 24s linear infinite;
      pointer-events: none;
    }

    @keyframes saduDrift {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(3%, 2%) rotate(2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(138, 21, 56, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(138, 21, 56, 0.65);
    }

    /* إعدادات الطباعة الحرارية للفواتير */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #thermal-receipt-print-area,
      #thermal-receipt-print-area * {
        visibility: visible !important;
      }
      #thermal-receipt-print-area {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        max-width: 80mm !important;
        margin: 0 auto !important;
        padding: 12px !important;
        background: #FFFFFF !important;
        color: #000000 !important;
        box-shadow: none !important;
        border: none !important;
        z-index: 99999 !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>

    function loadAppState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_STATE));
          return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }
        const parsed = JSON.parse(raw);
        if (!parsed.platformSettings || !Array.isArray(parsed.platformSettings.plans) || parsed.platformSettings.plans.length !== 2) {
          parsed.platformSettings = DEFAULT_STATE.platformSettings;
        }
        return parsed;
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    let appState = loadAppState();

    function saveAppState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
      clearTimeout(__cloudSyncTimer);
      __cloudSyncTimer = setTimeout(() => {
        syncStateToCloud();
      }, 400);
    }

    // مزامنة سحابية اختيارية عبر Supabase (تعمل تلقائياً عند إدخال الرابط والمفتاح)
    // ============================================================================
    const CLOUD_CONFIG_KEY = 'diyafa_qa_supabase_config_v1';

    function getCloudConfig() {
      try {
        return JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY) || 'null');
      } catch (e) {
        return null;
      }
    }

    function setCloudConfig(url, anonKey) {
      const cleanUrl = (url || '').trim().replace(/\/+$/, '');
      const cleanKey = (anonKey || '').trim();
      if (!cleanUrl || !cleanKey) {
        localStorage.removeItem(CLOUD_CONFIG_KEY);
        return;
      }
      localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify({ url: cleanUrl, anonKey: cleanKey }));
    }

    let __cloudSyncTimer = null;

    async function syncStateToCloud() {
      const cfg = getCloudConfig();
      if (!cfg || !cfg.url || !cfg.anonKey) return;
      try {
        const endpoint = `${cfg.url}/rest/v1/diyafa_state`;
        const headers = {
          'apikey': cfg.anonKey,
          'Authorization': `Bearer ${cfg.anonKey}`,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates,return=minimal'
        };
        const payload = [{ id: 'main_state', state_json: appState, updated_at: new Date().toISOString() }];
        let res = await fetch(`${endpoint}?on_conflict=id`, {
          method: 'POST',
          headers,
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          res = await fetch(`${endpoint}?id=eq.main_state`, {
            method: 'PATCH',
            headers,
            body: JSON.stringify({ state_json: appState, updated_at: new Date().toISOString() })
          });
        }
      } catch (err) {
        console.warn('Cloud sync push skipped:', err);
      }
    }

    async function pullStateFromCloud(silent = true) {
      const cfg = getCloudConfig();
      if (!cfg || !cfg.url || !cfg.anonKey) return false;
      try {
        const endpoint = `${cfg.url}/rest/v1/diyafa_state?id=eq.main_state&select=state_json`;
        const res = await fetch(endpoint, {
          headers: {
            'apikey': cfg.anonKey,
            'Authorization': `Bearer ${cfg.anonKey}`
          }
        });
        if (!res.ok) return false;
        const rows = await res.json();
        if (Array.isArray(rows) && rows.length > 0 && rows[0].state_json && rows[0].state_json.restaurants) {
          const remoteStr = JSON.stringify(rows[0].state_json);
          const localStr = JSON.stringify(appState);
          if (remoteStr !== localStr) {
            appState = rows[0].state_json;
            localStorage.setItem(STORAGE_KEY, remoteStr);
            applyThemeAndLang();
            renderApp();
            if (!silent) showToast('تمت مزامنة البيانات من السحابة بنجاح!', 'success');
          } else if (!silent) {
            showToast('البيانات محدّثة بالفعل مع السحابة.', 'info');
          }
          return true;
        }
        return false;
      } catch (err) {
        if (!silent) showToast('تعذر الاتصال بقاعدة البيانات السحابية.', 'error');
        return false;
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-stone-900 dark:bg-stone-800 text-white border-emerald-500',
        error: 'bg-rose-950 text-white border-rose-500',
        info: 'bg-stone-900 text-white border-amber-500'
      };
      toast.className = `pointer-events-auto border-r-4 ${colors[type] || colors.success} px-4 py-3 rounded-xl shadow-xl text-sm font-medium flex items-center justify-between gap-3 animate-slide-up`;
      toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="text-stone-400 hover:text-white text-xs">✕</button>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3800);
    }

    function copyTextSafe(text, successMsg) {
      const tempInput = document.createElement('textarea');
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast(successMsg || t('copied'), 'success');
      } catch (err) {

    // ============================================================================
    // آلية تنزيل ملفات موثوقة مع نافذة فورية للنسخ أو الفتح في تبويب جديد
    // ============================================================================
    function triggerReliableDownload(filename, content, mimeType = 'application/octet-stream') {
      try {
        const isString = typeof content === 'string';
        const blob = content instanceof Blob ? content : new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.rel = 'noopener noreferrer';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1200);

        if (isString) {
          window.__lastGeneratedFile = { filename, content, mimeType };
          openFileFallbackModal(filename, content, mimeType);
        } else {
          const reader = new FileReader();
          reader.onload = function () {
            const textFallback = typeof reader.result === 'string' ? reader.result : '';
            window.__lastGeneratedFile = { filename, content: textFallback, mimeType };
          };
          reader.readAsText(blob);
          showToast(
            appState.lang === 'ar'
              ? `تم إرسال أمر تنزيل (${filename}). إذا لم يظهر في جهازك بسبب قيود المتصفح، استخدم خيارات الحفظ/النسخ.`
              : `Download triggered for (${filename}).`,
            'success'
          );
        }
      } catch (err) {
        console.error('Download error:', err);
        if (typeof content === 'string') {
          window.__lastGeneratedFile = { filename, content, mimeType };
          openFileFallbackModal(filename, content, mimeType);
        } else {
          showToast('تعذر تنزيل الملف مباشرة في هذا المتصفح.', 'error');
        }
      }
    }

    function openStandaloneFileTab() {
      const file = window.__lastGeneratedFile;
      if (!file) return;
      const blob = new Blob([file.content], { type: file.mimeType || 'text/plain;charset=utf-8' });
      const blobUrl = URL.createObjectURL(blob);
      window.open(blobUrl, '_blank', 'noopener,noreferrer');
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
    }

    // ============================================================================
    // نظام التوجيه المعزول (Isolated Routing)
    // ============================================================================
    function parseHashRoute() {
      const hash = window.location.hash.replace(/^#\/?/, '');
      if (!hash) {
        sessionState.route = 'landing';
        return;
      }
      const [pathPart, queryPart] = hash.split('?');
      const params = new URLSearchParams(queryPart || '');
      if (['landing', 'customer', 'staff', 'owner'].includes(pathPart)) {
        sessionState.route = pathPart;
      }
      if (params.get('restaurant')) {
        sessionState.restaurantId = params.get('restaurant');
      }
      if (params.get('table')) {
        sessionState.tableParam = params.get('table');
        sessionState.selectedTable = params.get('table');
        sessionState.orderType = 'dine_in';
      }
      if (params.get('standalone') === '1') {
        togglePreviewBar(false);
      }
    }

    function navigateTo(route, restaurantId = null, table = null) {
      sessionState.route = route;
      if (restaurantId) sessionState.restaurantId = restaurantId;
      if (table) {
        sessionState.tableParam = table;
        sessionState.selectedTable = table;
        sessionState.orderType = 'dine_in';
      }
      let newHash = `#/${route}`;
      const params = new URLSearchParams();
      if (restaurantId && (route === 'customer' || route === 'staff')) {
        params.set('restaurant', restaurantId);
      }
      if (table && route === 'customer') {
        params.set('table', table);
      }
      const qs = params.toString();
      if (qs) newHash += `?${qs}`;
      window.location.hash = newHash;
      updatePreviewBarActiveState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buildShareableLink(route, restaurantId = null, table = null) {
      const baseUrl = window.location.href.split('#')[0];
      const params = new URLSearchParams();
      if (restaurantId) params.set('restaurant', restaurantId);
      if (table) params.set('table', table);
      params.set('standalone', '1');
      return `${baseUrl}#/${route}?${params.toString()}`;
    }

    function togglePreviewBar(show) {
      const bar = document.getElementById('preview-switcher-bar');
      const btn = document.getElementById('restore-preview-btn');
      if (show) {
        bar.classList.remove('hidden');
        btn.classList.add('hidden');
      } else {
        bar.classList.add('hidden');
        btn.classList.remove('hidden');
      }
    }

    function updatePreviewBarActiveState() {
      ['landing', 'customer', 'staff', 'owner'].forEach(r => {
        const el = document.getElementById(`nav-btn-${r}`);

                  ${isAr ? 'أدخل بيانات مطعمك وسيتم إنشاء حسابك وإرساله فوراً إلى لوحة إدارة المنصة للتفعيل.' : 'Enter your restaurant details to submit for activation in the Owner Console.'}
                </p>

                <form onsubmit="handleNewRestaurantRegister(event)" class="space-y-4">
                  <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                      <label class="block text-xs font-semibold mb-1.5">${t('restaurantNameAr')} *</label>
                      <input type="text" id="reg-name-ar" required placeholder="مثال: مطعم اللؤلؤة الشعبي" class="w-full px-4 py-2.5 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-sm focus:border-qatar-maroon outline-none" />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold mb-1.5">${t('restaurantNameEn')} *</label>
                      <input type="text" id="reg-name-en" required placeholder="e.g. Al Pearl Traditional Kitchen" class="w-full px-4 py-2.5 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-sm focus:border-qatar-maroon outline-none" />
                    </div>
                  </div>

                  <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                      <label class="block text-xs font-semibold mb-1.5">${t('managerEmail')} *</label>
                      <input type="email" id="reg-email" required placeholder="owner@restaurant.qa" class="w-full px-4 py-2.5 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-sm focus:border-qatar-maroon outline-none" />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold mb-1.5">${t('phoneQatar')} *</label>
                      <input type="tel" id="reg-phone" required placeholder="+974 5500 0000" dir="ltr" class="w-full px-4 py-2.5 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-sm focus:border-qatar-maroon outline-none" />
                    </div>
                  </div>

                  <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                      <label class="block text-xs font-semibold mb-1.5">${t('choosePlan')} *</label>
                      <select id="reg-plan" class="w-full px-4 py-2.5 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-sm focus:border-qatar-maroon outline-none">
                        ${plans.map(p => `<option value="${p.id}">${isAr ? p.nameAr : p.nameEn} (${p.price} ${t('currency')})</option>`).join('')}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-semibold mb-1.5">${isAr ? 'رمز مرور الموظفين المقترح' : 'Preferred Staff Passcode'} *</label>
                      <input type="text" id="reg-passcode" required maxlength="6" value="1122" class="w-full px-4 py-2.5 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-sm font-latin focus:border-qatar-maroon outline-none" />
                    </div>
                  </div>

                  <button type="submit" class="w-full py-3.5 rounded-xl bg-qatar-maroon hover:bg-qatar-maroonDark text-white font-bold text-sm shadow-lg transition">
                    ${t('submitRegistration')}
                  </button>
                </form>
              </div>
            </div>
          </section>

          <footer class="mt-auto border-t border-stone-200 dark:border-stone-800 py-8 px-4 text-center text-xs text-stone-500 dark:text-stone-400">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              ${renderBrandLogo()}
              <p>© 2026 ${isAr ? 'ضيافة QA — صُمم بفخر لقطاع المطاعم والضيافة في دولة قطر' : 'Diyafa QA — Built for Hospitality & Restaurants in Qatar'}</p>
            </div>
          </footer>
        </div>
      `;
    }

    function selectPlanForReg(planId) {
      const sel = document.getElementById('reg-plan');
      if (sel) sel.value = planId;
    }

    function handleNewRestaurantRegister(e) {
      e.preventDefault();
      const nameAr = document.getElementById('reg-name-ar').value.trim();
      const nameEn = document.getElementById('reg-name-en').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const planId = document.getElementById('reg-plan').value;
      const passcode = document.getElementById('reg-passcode').value.trim() || '1234';
      const selectedPlan = appState.platformSettings.plans.find(p => p.id === planId) || appState.platformSettings.plans[0];

      const slug = nameEn.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Math.floor(100 + Math.random() * 900);

      const newRest = {
        id: slug,
        nameAr,
        nameEn,
        descAr: 'أهلاً بكم في مطعمنا، نسعد بخدمتكم وتقديم أشهى الأطباق الطازجة.',
        descEn: 'Welcome to our restaurant, delighted to serve you fresh delicious dishes.',
        heroImage: '',
        phone,
        email,
        password: 'rest' + Math.floor(1000 + Math.random() * 9000),
        staffPasscode: passcode,
        planId,
        status: 'pending',
        subscriptionExpiry: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
        tablesCount: Math.min(selectedPlan.maxTables || 10, 10),
        deliveryFee: 10,
        minOrderDelivery: 30,
        enableDineIn: true,
        enablePickup: true,
        enableDelivery: true,
        menu: [],
        orders: []
      };

      appState.restaurants.push(newRest);
      saveAppState();
      e.target.reset();
      showToast(appState.lang === 'ar' ? 'تم استلام طلب تسجيل مطعمك بنجاح! يظهر الآن في لوحة المالك للتفعيل.' : 'Restaurant registration submitted! Now visible in Owner Console.', 'success');
    }

    // ============================================================================
    // 2. الصفحة الثانية: صفحة العملاء المعزولة لكل مطعم
    // ============================================================================
    function getActiveRestaurant() {
      return appState.restaurants.find(r => r.id === sessionState.restaurantId) || appState.restaurants[0];
    }

    function renderCustomerPage() {
      const rest = getActiveRestaurant();
      const isAr = appState.lang === 'ar';
      if (!rest) return `<div class="p-10 text-center">المطعم غير موجود</div>`;

      if (rest.status === 'suspended') {
        return renderSuspendedTenantScreen(rest);
      }

      const plan = getRestaurantPlan(rest);
      const effectiveTablesCount = Math.min(Number(rest.tablesCount || 6), Number(plan.maxTables || 10));

      const categories = ['ALL', ...new Set(rest.menu.map(item => isAr ? item.categoryAr : (item.categoryEn || item.categoryAr)).filter(Boolean))];
      const filteredMenu = rest.menu.filter(item => {
        const cat = isAr ? item.categoryAr : (item.categoryEn || item.categoryAr);
        const matchCat = sessionState.customerCategory === 'ALL' || cat === sessionState.customerCategory;
        const q = sessionState.customerSearch.toLowerCase().trim();
        const matchQuery = !q ||
          (item.nameAr && item.nameAr.toLowerCase().includes(q)) ||
          (item.nameEn && item.nameEn.toLowerCase().includes(q)) ||
          (item.descAr && item.descAr.toLowerCase().includes(q));
        return matchCat && matchQuery;
      });

      const subtotal = sessionState.cart.reduce((sum, c) => sum + (c.price * c.qty), 0);
      const deliveryCost = (sessionState.orderType === 'delivery' && subtotal > 0) ? Number(rest.deliveryFee || 0) : 0;
      const grandTotal = subtotal + deliveryCost;
      const totalItemsCount = sessionState.cart.reduce((sum, c) => sum + c.qty, 0);

      const heroBannerStyle = rest.heroImage
        ? `background-image: linear-gradient(to top, rgba(20,18,17,0.88), rgba(20,18,17,0.45)), url('${rest.heroImage}'); background-size: cover; background-position: center;`
        : '';

      return `
        <div class="min-h-screen flex flex-col pb-24 lg:pb-10 animate-fade-in">
          <header class="bg-white/90 dark:bg-stone-950/90 backdrop-blur border-b border-stone-200 dark:border-stone-800 sticky top-0 z-30">
            <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <span class="font-display font-bold text-base sm:text-lg text-stone-900 dark:text-white">${isAr ? rest.nameAr : rest.nameEn}</span>
                ${sessionState.tableParam ? `<span class="px-2.5 py-0.5 rounded-full bg-qatar-maroon/10 text-qatar-maroon dark:text-amber-400 text-xs font-bold">${isAr ? 'طاولة' : 'Table'} #${sessionState.tableParam}</span>` : ''}
              </div>
              ${renderHeaderControls()}
            </div>
          </header>

          <section class="${rest.heroImage ? '' : 'sadu-ambient-bg'} text-white py-12 sm:py-16 px-4 shadow-inner" style="${heroBannerStyle}">
            <div class="max-w-4xl mx-auto text-center space-y-3 relative z-10 animate-slide-up">
              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/15 backdrop-blur-sm text-xs font-medium text-amber-200 border border-white/15">
                <span>${isAr ? 'أهلاً ومرحباً بكم' : 'Welcome'}</span>
                <span>•</span>
                <span dir="ltr">${rest.phone}</span>
              </div>
              <h1 class="font-display font-extrabold text-3xl sm:text-5xl tracking-tight">
                ${isAr ? rest.nameAr : rest.nameEn}
              </h1>
              <p class="max-w-2xl mx-auto text-sm sm:text-base text-stone-200 leading-relaxed">
                ${isAr ? rest.descAr : rest.descEn}
              </p>
            </div>
          </section>

          <div class="max-w-6xl w-full mx-auto px-4 pt-6 grid lg:grid-cols-12 gap-7 items-start">
            <div class="lg:col-span-7 space-y-5">
              <div class="relative">
                <input
                  type="text"
                  value="${sessionState.customerSearch}"
                  oninput="sessionState.customerSearch = this.value; renderApp();"
                  placeholder="${t('searchMenu')}"
                  class="w-full px-4 py-3 rounded-2xl bg-white dark:bg-qatar-stoneCard border border-stone-200 dark:border-stone-800 text-sm focus:border-qatar-maroon outline-none shadow-sm"
                />
              </div>

              ${rest.menu.length > 0 ? `
                <div class="flex items-center gap-2 overflow-x-auto pb-1">
                  ${categories.map(cat => {
                    const active = sessionState.customerCategory === cat;
                    const label = cat === 'ALL' ? t('allCategories') : cat;
                    return `
                      <button
                        onclick="sessionState.customerCategory = '${cat.replace(/'/g, "\\'")}'; renderApp();"
                        class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${active ? 'bg-qatar-maroon text-white shadow-sm' : 'bg-white dark:bg-qatar-stoneCard border border-stone-200 dark:border-stone-800 text-stone-700 dark:text-stone-300 hover:border-qatar-maroon'}">
                        ${label}
                      </button>
                    `;
                  }).join('')}
                </div>
              ` : ''}

              ${rest.menu.length === 0 ? `
                <div class="p-10 rounded-3xl bg-white dark:bg-qatar-stoneCard border border-dashed border-stone-300 dark:border-stone-700 text-center space-y-3">
                  <div class="w-12 h-12 rounded-2xl bg-amber-500/15 text-amber-700 dark:text-amber-400 mx-auto flex items-center justify-center font-bold text-xl">☰</div>
                  <h3 class="font-display font-bold text-lg">${t('menuEmptyTitle')}</h3>
                  <p class="text-sm text-stone-500 dark:text-stone-400 max-w-md mx-auto leading-relaxed">${t('menuEmptyDesc')}</p>
                </div>
              ` : filteredMenu.length === 0 ? `
                <div class="p-8 rounded-2xl bg-white dark:bg-qatar-stoneCard text-center text-sm text-stone-500">
                  ${isAr ? 'لا توجد أطباق مطابقة لبحثك.' : 'No dishes match your search.'}
                </div>
              ` : `
                <div class="space-y-3">
                  ${filteredMenu.map(item => {
                    const inCart = sessionState.cart.find(c => c.id === item.id);
                    const tags = item.tags || [];
                    return `
                      <div class="p-4 sm:p-5 rounded-2xl bg-white dark:bg-qatar-stoneCard border border-stone-200/90 dark:border-stone-800 hover:border-qatar-maroon/40 transition flex items-start justify-between gap-4 ${!item.available ? 'opacity-60' : ''}">
                        <div class="space-y-1.5 flex-1">
                          <div class="flex flex-wrap items-center gap-2">
                            <h3 class="font-display font-bold text-base sm:text-lg text-stone-900 dark:text-white">
                              ${isAr ? item.nameAr : (item.nameEn || item.nameAr)}
                            </h3>
                            ${tags.includes('spicy') ? `<span class="px-2 py-0.5 rounded-md bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300 text-[11px] font-semibold">${t('spicy')}</span>` : ''}
                            ${tags.includes('veg') ? `<span class="px-2 py-0.5 rounded-md bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-[11px] font-semibold">${t('veg')}</span>` : ''}
                            ${tags.includes('popular') ? `<span class="px-2 py-0.5 rounded-md bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 text-[11px] font-semibold">${t('popular')}</span>` : ''}
                            ${!item.available ? `<span class="px-2 py-0.5 rounded-md bg-stone-200 dark:bg-stone-800 text-stone-600 text-[11px] font-semibold">${t('unavailable')}</span>` : ''}
                          </div>
                          ${(isAr ? item.descAr : (item.descEn || item.descAr)) ? `
                            <p class="text-xs sm:text-sm text-stone-500 dark:text-stone-400 leading-relaxed">
                              ${isAr ? item.descAr : (item.descEn || item.descAr)}
                            </p>
                          ` : ''}
                          <div class="pt-1 font-latin font-extrabold text-base text-qatar-maroon dark:text-amber-400">
                            ${Number(item.price).toFixed(0)} <span class="text-xs font-sans font-semibold">${t('currency')}</span>
                          </div>
                        </div>

                        <div class="shrink-0 self-center">
                          ${!item.available ? '' : inCart ? `
                            <div class="flex items-center gap-2 bg-stone-100 dark:bg-stone-800 p-1 rounded-xl border border-stone-200 dark:border-stone-700">
                              <button onclick="updateCartQty('${item.id}', -1)" class="w-8 h-8 rounded-lg bg-white dark:bg-stone-900 font-bold text-stone-700 dark:text-white hover:bg-rose-100 transition">-</button>
                              <span class="font-latin font-bold text-sm w-5 text-center">${inCart.qty}</span>
                              <button onclick="updateCartQty('${item.id}', 1)" class="w-8 h-8 rounded-lg bg-qatar-maroon text-white font-bold hover:bg-qatar-maroonDark transition">+</button>
                            </div>
                          ` : `
                            <button onclick="addToCart('${item.id}')" class="px-4 py-2 rounded-xl bg-qatar-maroon/10 hover:bg-qatar-maroon text-qatar-maroon hover:text-white dark:bg-qatar-maroon dark:text-white font-semibold text-xs sm:text-sm transition">
                              + ${t('addToCart')}
                            </button>
                          `}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <div id="checkout-section" class="lg:col-span-5 bg-white dark:bg-qatar-stoneCard border border-stone-200 dark:border-stone-800 rounded-3xl p-5 sm:p-6 shadow-sm sticky top-20 space-y-5">
              <div class="flex items-center justify-between border-b border-stone-100 dark:border-stone-800 pb-3.5">
                <h2 class="font-display font-bold text-xl">${t('yourCart')}</h2>
                <span class="px-2.5 py-0.5 rounded-full bg-qatar-maroon text-white font-latin text-xs font-bold">${totalItemsCount}</span>
              </div>

              ${sessionState.cart.length === 0 ? `
                <div class="py-8 text-center text-sm text-stone-500 dark:text-stone-400">
                  ${t('emptyCart')}
                </div>
              ` : `
                <div class="space-y-3 max-h-64 overflow-y-auto pr-1">
                  ${sessionState.cart.map(item => `
                    <div class="p-3 rounded-2xl bg-stone-50 dark:bg-stone-900/80 border border-stone-200/70 dark:border-stone-800 space-y-2">
                      <div class="flex items-center justify-between gap-2">
                        <div>
                          <div class="font-semibold text-sm">${isAr ? item.nameAr : (item.nameEn || item.nameAr)}</div>
                          <div class="text-xs text-qatar-maroon dark:text-amber-400 font-latin font-bold">${item.price * item.qty} ${t('currency')}</div>
                        </div>
                        <div class="flex items-center gap-1.5">
                          <button onclick="updateCartQty('${item.id}', -1)" class="w-7 h-7 rounded-lg bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-xs font-bold">-</button>
                          <span class="font-latin text-xs font-bold w-5 text-center">${item.qty}</span>
                          <button onclick="updateCartQty('${item.id}', 1)" class="w-7 h-7 rounded-lg bg-qatar-maroon text-white text-xs font-bold">+</button>
                        </div>
                      </div>
                      <input
                        type="text"
                        value="${item.note || ''}"
                        onchange="updateCartNote('${item.id}', this.value)"
                        placeholder="${isAr ? 'ملاحظة على الطبق (مثلاً: بدون شطة)...' : 'Dish note (e.g. no spicy)...'}"
                        class="w-full px-2.5 py-1.5 rounded-lg bg-white dark:bg-stone-950 border border-stone-200 dark:border-stone-800 text-xs outline-none"
                      />
                    </div>
                  `).join('')}
                </div>

                <div class="space-y-3 pt-2 border-t border-stone-100 dark:border-stone-800">
                  <div class="grid grid-cols-3 gap-2">
                    ${rest.enableDineIn ? `
                      <button type="button" onclick="sessionState.orderType = 'dine_in'; renderApp();" class="py-2 px-2 rounded-xl text-xs font-semibold border transition ${sessionState.orderType === 'dine_in' ? 'bg-qatar-maroon text-white border-qatar-maroon' : 'border-stone-200 dark:border-stone-700 hover:border-qatar-maroon'}">
                        ${t('dineIn')}
                      </button>
                    ` : ''}
                    ${rest.enablePickup ? `
                      <button type="button" onclick="sessionState.orderType = 'pickup'; renderApp();" class="py-2 px-2 rounded-xl text-xs font-semibold border transition ${sessionState.orderType === 'pickup' ? 'bg-qatar-maroon text-white border-qatar-maroon' : 'border-stone-200 dark:border-stone-700 hover:border-qatar-maroon'}">
                        ${t('pickup')}
                      </button>
                    ` : ''}
                    ${rest.enableDelivery ? `
                      <button type="button" onclick="sessionState.orderType = 'delivery'; renderApp();" class="py-2 px-2 rounded-xl text-xs font-semibold border transition ${sessionState.orderType === 'delivery' ? 'bg-qatar-maroon text-white border-qatar-maroon' : 'border-stone-200 dark:border-stone-700 hover:border-qatar-maroon'}">
                        ${t('delivery')}
                      </button>
                    ` : ''}
                  </div>

                  ${sessionState.orderType === 'dine_in' ? `
                    <div>
                      <label class="block text-xs font-semibold mb-1">${t('tableNum')}</label>
                      <select onchange="sessionState.selectedTable = this.value" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-sm">
                        ${Array.from({ length: effectiveTablesCount }, (_, i) => i + 1).map(num => `
                          <option value="${num}" ${String(sessionState.selectedTable) === String(num) ? 'selected' : ''}>${isAr ? 'طاولة رقم' : 'Table'} ${num}</option>
                        `).join('')}
                      </select>
                    </div>
                  ` : ''}

                  ${sessionState.orderType === 'pickup' ? `
                    <div class="grid sm:grid-cols-2 gap-2.5">
                      <input type="text" value="${sessionState.customerName}" oninput="sessionState.customerName = this.value" placeholder="${isAr ? 'الاسم الكريم' : 'Your Name'}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-xs" />
                      <input type="tel" value="${sessionState.customerPhone}" oninput="sessionState.customerPhone = this.value" placeholder="+974 5500 0000" dir="ltr" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-xs" />
                    </div>
                  ` : ''}

                  ${sessionState.orderType === 'delivery' ? `
                    <div class="space-y-2.5">
                      <div class="grid sm:grid-cols-2 gap-2.5">
                        <input type="text" value="${sessionState.customerName}" oninput="sessionState.customerName = this.value" placeholder="${isAr ? 'الاسم الكامل *' : 'Full Name *'}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-xs" />
                        <input type="tel" value="${sessionState.customerPhone}" oninput="sessionState.customerPhone = this.value" placeholder="${isAr ? 'الجوال القطري * (+974...)' : 'Qatar Mobile * (+974...)'}" dir="ltr" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-xs" />
                      </div>
                      <button type="button" onclick="detectCustomerGPS()" class="w-full py-2.5 px-3 rounded-xl border border-dashed border-qatar-maroon bg-qatar-maroon/5 hover:bg-qatar-maroon/10 text-qatar-maroon dark:text-amber-400 text-xs font-semibold flex items-center justify-center gap-2 transition">
                        <span>📍</span>
                        <span>${sessionState.customerCoords ? t('locationDetected') : t('detectLocation')}</span>
                      </button>
                      ${sessionState.customerCoords ? `
                        <div class="text-[11px] text-emerald-700 dark:text-emerald-400 font-latin text-center">
                          GPS: ${sessionState.customerCoords.lat.toFixed(5)}, ${sessionState.customerCoords.lng.toFixed(5)}
                        </div>
                      ` : ''}
                      <input type="text" value="${sessionState.customerAddress}" oninput="sessionState.customerAddress = this.value" placeholder="${t('addressPlaceholder')}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-xs" />
                    </div>
                  ` : ''}

                  <div class="p-3 rounded-xl bg-stone-50 dark:bg-stone-900/70 border border-stone-200 dark:border-stone-800 text-xs">
                    <div class="font-semibold text-stone-700 dark:text-stone-300 mb-0.5">${t('paymentMethodLabel')}:</div>
                    <div class="text-stone-500 dark:text-stone-400">${t('payOnsite')}</div>
                  </div>

                  <div class="space-y-1.5 text-sm pt-2 border-t border-stone-100 dark:border-stone-800">
                    <div class="flex justify-between text-stone-500">
                      <span>${isAr ? 'المجموع الفرعي' : 'Subtotal'}</span>
                      <span class="font-latin font-semibold">${subtotal} ${t('currency')}</span>
                    </div>
                    ${sessionState.orderType === 'delivery' ? `
                      <div class="flex justify-between text-stone-500">
                        <span>${isAr ? 'رسوم التوصيل' : 'Delivery Fee'}</span>
                        <span class="font-latin font-semibold">${deliveryCost} ${t('currency')}</span>
                      </div>
                    ` : ''}
                    <div class="flex justify-between font-bold text-base pt-1 text-stone-900 dark:text-white">
                      <span>${isAr ? 'الإجمالي النهائي' : 'Grand Total'}</span>
                      <span class="font-latin text-qatar-maroon dark:text-amber-400">${grandTotal} ${t('currency')}</span>

    function addToCart(itemId, qty = 1) {
      const rest = getActiveRestaurant();
      const item = rest.menu.find(m => m.id === itemId);
      if (!item || !item.available) return;
      const existing = sessionState.cart.find(c => c.id === itemId);
      if (existing) {
        existing.qty += qty;
      } else {
        sessionState.cart.push({
          id: item.id,
          nameAr: item.nameAr,
          nameEn: item.nameEn || item.nameAr,
          price: Number(item.price),
          qty: qty,
          note: ''
        });
      }
      renderApp();
    }

    function updateCartQty(itemId, delta) {
      const idx = sessionState.cart.findIndex(c => c.id === itemId);
      if (idx === -1) return;
      sessionState.cart[idx].qty += delta;
      if (sessionState.cart[idx].qty <= 0) {
        sessionState.cart.splice(idx, 1);
      }
      renderApp();
    }

    function updateCartNote(itemId, note) {
      const item = sessionState.cart.find(c => c.id === itemId);
      if (item) item.note = note;
    }

    function detectCustomerGPS() {
      if (!navigator.geolocation) {
        showToast(appState.lang === 'ar' ? 'المتصفح لا يدعم تحديد الموقع، يرجى كتابة العنوان يدوياً.' : 'Geolocation not supported.', 'error');
        return;
      }
      showToast(appState.lang === 'ar' ? 'جاري تحديد موقعك الحالي...' : 'Detecting your location...', 'info');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          sessionState.customerCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          showToast(t('locationDetected'), 'success');
          renderApp();
        },
        () => {
          sessionState.customerCoords = { lat: 25.2854, lng: 51.5310 };
          showToast(appState.lang === 'ar' ? 'تم التقاط موقع تقريبي، يمكنك إضافة تفاصيل العنوان في الحقل أدناه.' : 'Approximate location set, please add address details.', 'info');
          renderApp();
        },
        { timeout: 6000 }
      );
    }

    function handleChatOrderSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input-field');
      const text = input.value.trim();
      if (!text) return;

      const rest = getActiveRestaurant();
      const isAr = appState.lang === 'ar';
      sessionState.chatMessages.push({ sender: 'user', text });

      const normalized = text.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).toLowerCase();
      let addedItems = [];

      rest.menu.forEach(dish => {
        if (!dish.available) return;
        const nameArWords = (dish.nameAr || '').toLowerCase().split(/\s+/).filter(w => w.length > 2);
        const nameEnWords = (dish.nameEn || '').toLowerCase().split(/\s+/).filter(w => w.length > 2);
        const allKeywords = [...nameArWords, ...nameEnWords];

        if (allKeywords.some(kw => normalized.includes(kw))) {
          let qty = 1;
          const numMatch = normalized.match(/(\d+)/);
          if (numMatch) qty = Math.min(15, Math.max(1, parseInt(numMatch[1], 10)));
          else if (normalized.includes('ثنتين') || normalized.includes('اثنين') || normalized.includes('حبتين') || normalized.includes('two')) qty = 2;
          else if (normalized.includes('ثلاث') || normalized.includes('three')) qty = 3;

          addToCart(dish.id, qty);
          addedItems.push(`${qty} × ${isAr ? dish.nameAr : dish.nameEn}`);
        }
      });

      if (addedItems.length > 0) {
        sessionState.chatMessages.push({
          sender: 'bot',
          text: isAr
            ? `أبشر طال عمرك! أضفت للسلة: <strong>${addedItems.join('، ')}</strong>. تقدر تراجع السلة وتأكد طلبك في أي وقت.`
            : `Added to your cart: <strong>${addedItems.join(', ')}</strong>. You can review and confirm your order anytime.`
        });
      } else {
        sessionState.chatMessages.push({
          sender: 'bot',
          text: isAr
            ? `ما قدرت أحدد الطبق بالضبط من المنيو المتاح. جرب تكتب اسم الطبق مثل الموجود بالقائمة.`
            : `I couldn't match that exact dish. Please mention a dish name from the menu.`
        });
      }

      renderApp();
      setTimeout(() => {
        const box = document.getElementById('chat-messages-box');
        if (box) box.scrollTop = box.scrollHeight;
      }, 50);
    }

    function submitCustomerOrder() {
      const rest = getActiveRestaurant();
      const isAr = appState.lang === 'ar';
      if (sessionState.cart.length === 0) return;

      if (sessionState.orderType === 'delivery') {
        if (!sessionState.customerPhone.trim()) {
          showToast(isAr ? 'يرجى إدخال رقم الجوال القطري للتوصيل' : 'Please enter Qatar mobile number for delivery', 'error');
          return;
        }
        if (!sessionState.customerCoords && !sessionState.customerAddress.trim()) {
          showToast(isAr ? 'يرجى تحديد موقعك الحالي (GPS) أو كتابة العنوان' : 'Please share GPS location or enter address', 'error');
          return;
        }
      }

      const subtotal = sessionState.cart.reduce((s, c) => s + (c.price * c.qty), 0);
      const deliveryFee = sessionState.orderType === 'delivery' ? Number(rest.deliveryFee || 0) : 0;

      const newOrder = {
        id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
        createdAt: new Date().toISOString(),
        completedAt: null,
        printedAt: null,
        status: 'new',
        orderType: sessionState.orderType,
        tableNumber: sessionState.orderType === 'dine_in' ? sessionState.selectedTable : '',
        customerName: sessionState.customerName.trim() || (sessionState.orderType === 'dine_in' ? `طاولة ${sessionState.selectedTable}` : 'عميل ضيافة'),
        customerPhone: sessionState.customerPhone.trim(),
        address: sessionState.customerAddress.trim(),
        coords: sessionState.customerCoords,
        paymentMethod: 'cash_or_card_onsite',
        items: JSON.parse(JSON.stringify(sessionState.cart)),
        deliveryFee,
        total: subtotal + deliveryFee
      };

      rest.orders.unshift(newOrder);
      saveAppState();
      sessionState.cart = [];
      showToast(isAr ? `تم إرسال طلبك بنجاح! رقم الطلب: ${newOrder.id}` : `Order placed successfully! Order #${newOrder.id}`, 'success');
      renderApp();
    }

        `TOTAL: ${order.total} QAR`,

      return lines.join('\n');

    function executeReceiptPrint(orderId) {
      const rest = getActiveRestaurant();
      const order = rest.orders.find(o => o.id === orderId);
      if (order) {
        order.printedAt = new Date().toISOString();
        saveAppState();
      }

      const statusEl = document.getElementById('receipt-print-status-label');
      if (statusEl) {
        statusEl.className = 'inline-block mt-1 text-xs font-bold text-emerald-600 dark:text-emerald-400';
        statusEl.textContent = appState.lang === 'ar'
          ? `✓ تم تحديث حالة الطباعة (${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })})`
          : '✓ Print status updated';
      }

      const feedbackEl = document.getElementById('receipt-action-feedback');
      if (feedbackEl) {
        feedbackEl.classList.remove('hidden');
      }

      showToast(
        appState.lang === 'ar'
          ? 'تم تحديث حالة الفاتورة إلى (تمت الطباعة)!'
          : 'Receipt status updated to Printed!',
        'success'
      );

      try {
        window.print();
      } catch (e) {}
    }

    function openStandaloneReceiptWindow() {
      const html = document.getElementById('thermal-receipt-print-area')?.innerHTML || '';
      const blob = new Blob([`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Receipt</title></head><body style="max-width:360px;margin:20px auto;background:#fff;">${html}</body></html>`], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank', 'noopener,noreferrer');
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    function exportOrdersToExcel() {
      const rest = getActiveRestaurant();
      const isAr = appState.lang === 'ar';
      if (typeof XLSX === 'undefined') {
        showToast('مكتبة Excel قيد التحميل، حاول مرة أخرى.', 'error');
        return;
      }

      const rows = rest.orders.map(o => ({
        [isAr ? 'رقم الطلب' : 'Order ID']: o.id,
        [isAr ? 'التاريخ والوقت' : 'Date & Time']: new Date(o.createdAt).toLocaleString(),
        [isAr ? 'الحالة' : 'Status']: o.status,
        [isAr ? 'حالة الطباعة' : 'Printed']: o.printedAt ? 'Yes' : 'No',
        [isAr ? 'نوع الطلب' : 'Order Type']: o.orderType,
        [isAr ? 'رقم الطاولة' : 'Table']: o.tableNumber || '-',
        [isAr ? 'اسم العميل' : 'Customer']: o.customerName,
        [isAr ? 'رقم الجوال' : 'Phone']: o.customerPhone || '-',
        [isAr ? 'العنوان' : 'Address']: o.address || '-',
        [isAr ? 'الأصناف' : 'Items']: o.items.map(i => `${i.qty}x ${i.nameAr}`).join(' | '),
        [isAr ? 'رسوم التوصيل (ر.ق)' : 'Delivery Fee (QAR)']: o.deliveryFee || 0,
        [isAr ? 'الإجمالي (ر.ق)' : 'Total (QAR)']: o.total
      }));

      if (rows.length === 0) {
        rows.push({ [isAr ? 'ملاحظة' : 'Note']: isAr ? 'لا توجد طلبات مسجلة بعد' : 'No orders recorded yet' });
      }

      const worksheet = XLSX.utils.json_to_sheet(rows);
      const csvOutput = XLSX.utils.sheet_to_csv(worksheet);
      const fileName = `${rest.id}-orders-${new Date().toISOString().split('T')[0]}.csv`;
      triggerReliableDownload(fileName, '\uFEFF' + csvOutput, 'text/csv;charset=utf-8');
    }

    function handleManualDishAdd(e) {
      e.preventDefault();
      const rest = getActiveRestaurant();
      const nameAr = document.getElementById('dish-name-ar').value.trim();
      const nameEn = document.getElementById('dish-name-en').value.trim() || nameAr;
      const cat = document.getElementById('dish-cat').value.trim();
      const price = parseFloat(document.getElementById('dish-price').value) || 0;
      const desc = document.getElementById('dish-desc').value.trim();

      rest.menu.push({
        id: 'm-' + Date.now(),
        nameAr,
        nameEn,
        categoryAr: cat,
        categoryEn: cat,
        descAr: desc,
        descEn: desc,
        price,
        tags: [],
        available: true
      });
      saveAppState();
      closeModal();
      showToast(appState.lang === 'ar' ? 'تمت إضافة الطبق للمنيو' : 'Dish added to menu', 'success');
      renderApp();
    }

    function handleExcelFileSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (typeof XLSX === 'undefined') {
        showToast('مكتبة قراءة Excel غير متاحة حالياً، تأكد من الاتصال بالإنترنت.', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

          if (!jsonRows || jsonRows.length === 0) {
            showToast(appState.lang === 'ar' ? 'الملف فارغ ولا يحتوي على صفوف بيانات.' : 'File contains no data rows.', 'error');
            return;
          }

          const headers = Object.keys(jsonRows[0]);
          const guessCol = (keywords) => headers.find(h => keywords.some(k => h.toLowerCase().includes(k))) || '';

          sessionState.excelImportState = {
            headers,
            rows: jsonRows,
            fileName: file.name,
            mapName: guessCol(['اسم', 'وجب', 'طبق', 'صنف', 'name', 'dish', 'item', 'title']) || headers[0] || '',
            mapPrice: guessCol(['سعر', 'قيم', 'مبلغ', 'price', 'cost', 'qar', 'amount']) || headers[1] || '',
            mapCategory: guessCol(['فئ', 'تصنيف', 'قسم', 'نوع', 'cat', 'group', 'type']),
            mapDesc: guessCol(['وصف', 'تفاصيل', 'مكونات', 'desc', 'detail', 'note'])
          };

          showToast(appState.lang === 'ar' ? 'تمت قراءة أعمدة الملف! حدد الأعمدة أدناه ثم اضغط اعتماد.' : 'File columns read! Map columns below.', 'success');
          renderApp();
        } catch (err) {
          console.error(err);
          showToast(appState.lang === 'ar' ? 'تعذر قراءة الملف، تأكد أنه بصيغة Excel أو CSV صالحة.' : 'Failed to parse file.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function applyExcelMenuImport(replaceExisting = true) {
      const imp = sessionState.excelImportState;
      const isAr = appState.lang === 'ar';
      if (!imp.mapName || !imp.mapPrice) {
        showToast(isAr ? 'يرجى تحديد عمود (اسم الوجبة) وعمود (السعر) على الأقل.' : 'Please select Dish Name and Price columns.', 'error');
        return;
      }

      const rest = getActiveRestaurant();
      const newItems = [];

      imp.rows.forEach((row, idx) => {
        const rawName = String(row[imp.mapName] ?? '').trim();
        if (!rawName) return;

        const rawPriceStr = String(row[imp.mapPrice] ?? '0').replace(/[^\d.]/g, '');
        const price = parseFloat(rawPriceStr) || 0;

        const category = imp.mapCategory ? String(row[imp.mapCategory] ?? '').trim() : (isAr ? 'قائمة الطعام' : 'Menu');
        const desc = imp.mapDesc ? String(row[imp.mapDesc] ?? '').trim() : '';

        newItems.push({
          id: 'imp-' + Date.now() + '-' + idx,
          nameAr: rawName,
          nameEn: rawName,
          categoryAr: category || (isAr ? 'قائمة الطعام' : 'Menu'),
          categoryEn: category || 'Menu',
          descAr: desc,
          descEn: desc,
          price: price,
          tags: [],
          available: true
        });
      });

      if (newItems.length === 0) {
        showToast(isAr ? 'لم يتم العثور على وجبات صالحة في الأعمدة المحددة.' : 'No valid dishes found.', 'error');
        return;
      }

      if (replaceExisting) {
        rest.menu = newItems;
      } else {
        rest.menu = [...rest.menu, ...newItems];
      }

      saveAppState();
      sessionState.excelImportState = { headers: [], rows: [], fileName: '', mapName: '', mapPrice: '', mapCategory: '', mapDesc: '' };
      showToast(isAr ? `تم تحديث المنيو بـ (${newItems.length}) وجبة! تظهر الآن مباشرة في صفحة العملاء.` : `Menu updated with ${newItems.length} dishes!`, 'success');
      renderApp();
    }

    function saveRestaurantGeneralSettings(e) {
      e.preventDefault();
      const rest = getActiveRestaurant();
      const plan = getRestaurantPlan(rest);
      const maxTables = Number(plan.maxTables || 10);

      rest.nameAr = document.getElementById('set-name-ar').value.trim() || rest.nameAr;
      rest.nameEn = document.getElementById('set-name-en').value.trim() || rest.nameEn;
      rest.descAr = document.getElementById('set-desc-ar').value.trim();
      rest.staffPasscode = document.getElementById('set-passcode').value.trim() || rest.staffPasscode;

      let requestedTables = parseInt(document.getElementById('set-tables').value, 10) || 6;
      if (requestedTables > maxTables) {
        requestedTables = maxTables;
        showToast(
          appState.lang === 'ar'
            ? `الحد الأقصى للطاولات في باقتك هو ${maxTables} طاولات. تم ضبط العدد على الحد المسموح.`
            : `Your plan allows up to ${maxTables} tables. Value adjusted to plan limit.`,
          'info'
        );
      }
      rest.tablesCount = Math.max(1, requestedTables);
      rest.deliveryFee = parseFloat(document.getElementById('set-delivery-fee').value) || 0;

      saveAppState();
      showToast(appState.lang === 'ar' ? 'تم حفظ إعدادات المطعم بنجاح' : 'Settings saved successfully', 'success');
      renderApp();
    }

      const rest = getActiveRestaurant();
      const plan = getRestaurantPlan(rest);
      const isAr = appState.lang === 'ar';
      const count = Math.min(Number(rest.tablesCount || 6), Number(plan.maxTables || 10));

            <div>

            <button onclick="closeModal()" class="text-stone-400">✕</button>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 max-h-[60vh] overflow-y-auto p-1">
            ${Array.from({ length: count }, (_, i) => i + 1).map(num => {
              const link = buildShareableLink('customer', rest.id, num);
              return `
                <div class="p-3 rounded-2xl border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-center space-y-2">
                  <div class="font-display font-bold text-sm text-qatar-maroon dark:text-amber-400">${isAr ? 'طاولة' : 'Table'} #${num}</div>
                  <div id="qr-box-${num}" class="bg-white p-2 rounded-xl inline-block mx-auto"></div>
                  <button onclick="copyTextSafe('${link}', '${isAr ? 'تم نسخ رابط طاولة ' + num : 'Table link copied'}')" class="block w-full py-1.5 rounded-lg bg-stone-200 dark:bg-stone-800 text-[11px] font-semibold">
                    ${isAr ? 'نسخ الرابط' : 'Copy Link'}
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `);

      setTimeout(() => {
        if (typeof QRCode === 'undefined') return;
        for (let num = 1; num <= count; num++) {
          const el = document.getElementById(`qr-box-${num}`);
          if (el) {
            el.innerHTML = '';
            new QRCode(el, {
              text: buildShareableLink('customer', rest.id, num),
              width: 96,
              height: 96,
              colorDark: '#1C1917',
              colorLight: '#FFFFFF'
            });
          }
        }
      }, 100);
    }

                <span class="hidden sm:inline-block px-2.5 py-0.5 rounded-md bg-amber-500/20 text-amber-300 text-xs font-semibold">
                  ${isAr ? 'لوحة المالك والسيطرة الكاملة' : 'Super Admin Console'}
                </span>
              </div>
              <div class="flex items-center gap-2">
                ${renderHeaderControls()}
                <button onclick="sessionState.ownerAuthenticated = false; renderApp();" class="px-3 py-1.5 rounded-xl bg-stone-800 hover:bg-rose-900 text-xs font-semibold">
                  ${isAr ? 'خروج' : 'Logout'}
                </button>
              </div>
            </div>
          </header>

          <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 py-7 space-y-8">
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="p-5 rounded-2xl bg-white dark:bg-qatar-stoneCard border border-stone-200 dark:border-stone-800">
                <div class="text-xs text-stone-500">${isAr ? 'المطاعم النشطة' : 'Active Restaurants'}</div>
                <div class="font-latin font-extrabold text-3xl text-emerald-600 mt-1">${activeCount}</div>
              </div>
              <div class="p-5 rounded-2xl bg-white dark:bg-qatar-stoneCard border border-stone-200 dark:border-stone-800">
                <div class="text-xs text-stone-500">${isAr ? 'بانتظار التحويل البنكي' : 'Pending Activation'}</div>
                <div class="font-latin font-extrabold text-3xl text-amber-600 mt-1">${pendingCount}</div>
              </div>
              <div class="p-5 rounded-2xl bg-white dark:bg-qatar-stoneCard border border-stone-200 dark:border-stone-800">
                <div class="text-xs text-stone-500">${isAr ? 'مطاعم موقوفة' : 'Suspended'}</div>
                <div class="font-latin font-extrabold text-3xl text-rose-600 mt-1">${suspendedCount}</div>
              </div>
              <div class="p-5 rounded-2xl bg-white dark:bg-qatar-stoneCard border border-stone-200 dark:border-stone-800">
                <div class="text-xs text-stone-500">${isAr ? 'العائد الشهري المتوقع' : 'Monthly Recurring Revenue'}</div>
                <div class="font-latin font-extrabold text-3xl text-qatar-maroon dark:text-amber-400 mt-1">${monthlyRevenue} <span class="text-sm">${t('currency')}</span></div>
              </div>
            </div>

            <div class="bg-white dark:bg-qatar-stoneCard border border-stone-200 dark:border-stone-800 rounded-3xl p-6 shadow-sm space-y-5">
              <div>
                <h2 class="font-display font-bold text-xl">${isAr ? 'إدارة المطاعم المشتركة والباقات وحالة التشغيل' : 'Subscribed Restaurants, Plans & Status Control'}</h2>
                <p class="text-xs text-stone-500">${isAr ? 'إيقاف تشغيل مطعم يحجبه فوراً عن استقبال الطلبات أو الدخول للوحة الموظفين حتى يتم تفعيله مجدداً.' : 'Suspending a restaurant immediately blocks customer ordering and staff access until reactivated.'}</p>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-sm text-right">
                  <thead>
                    <tr class="border-b border-stone-200 dark:border-stone-800 text-xs text-stone-500">
                      <th class="py-3 px-3">${isAr ? 'المطعم' : 'Restaurant'}</th>
                      <th class="py-3 px-3">${isAr ? 'الباقة' : 'Plan'}</th>
                      <th class="py-3 px-3">${isAr ? 'الحالة' : 'Status'}</th>
                      <th class="py-3 px-3">${isAr ? 'الروابط المستقلة' : 'Isolated Links'}</th>
                      <th class="py-3 px-3">${isAr ? 'التحكم بالتشغيل' : 'Control'}</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-stone-100 dark:divide-stone-800">
                    ${appState.restaurants.map(r => {
                      const rPlan = getRestaurantPlan(r);
                      const statusColors = {
                        active: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300',
                        pending: 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300',
                        suspended: 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300'
                      };
                      const statusLabels = {
                        active: isAr ? 'نشط ويعمل' : 'Active',
                        pending: isAr ? 'بانتظار التحويل' : 'Pending Payment',
                        suspended: isAr ? 'موقوف' : 'Suspended'
                      };

                      return `
                        <tr>
                          <td class="py-3.5 px-3">
                            <div class="font-bold flex items-center gap-2">
                              <span>${isAr ? r.nameAr : r.nameEn}</span>
                              ${rPlan.prioritySupport ? `<span class="px-2 py-0.5 rounded bg-amber-100 text-amber-800 text-[10px] font-bold">${isAr ? 'أولوية دعم' : 'Priority'}</span>` : ''}
                            </div>
                            <div class="text-xs text-stone-500 font-latin" dir="ltr">${r.phone} • Code: ${r.staffPasscode} • Max Tables: ${rPlan.maxTables}</div>
                          </td>
                          <td class="py-3.5 px-3">
                            <select onchange="changeRestaurantPlan('${r.id}', this.value)" class="px-2.5 py-1.5 rounded-lg border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-xs font-semibold">
                              ${appState.platformSettings.plans.map(pl => `<option value="${pl.id}" ${r.planId === pl.id ? 'selected' : ''}>${isAr ? pl.nameAr : pl.nameEn} (${pl.price} ${t('currency')})</option>`).join('')}
                            </select>
                          </td>
                          <td class="py-3.5 px-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${statusColors[r.status]}">${statusLabels[r.status]}</span>
                          </td>
                          <td class="py-3.5 px-3">
                            <div class="flex flex-wrap gap-1.5">
                              <button type="button" onclick="copyTextSafe(buildShareableLink('customer', '${r.id}'), '${isAr ? 'تم نسخ رابط العملاء المعزول' : 'Customer link copied'}')" class="px-2.5 py-1 rounded-lg bg-stone-100 dark:bg-stone-800 hover:bg-qatar-maroon hover:text-white text-xs font-semibold transition">
                                ${isAr ? 'رابط العملاء' : 'Customer Link'}
                              </button>
                              <button type="button" onclick="copyTextSafe(buildShareableLink('staff', '${r.id}'), '${isAr ? 'تم نسخ رابط الموظفين المعزول' : 'Staff link copied'}')" class="px-2.5 py-1 rounded-lg bg-stone-100 dark:bg-stone-800 hover:bg-qatar-maroon hover:text-white text-xs font-semibold transition">
                                ${isAr ? 'رابط الموظفين' : 'Staff Link'}
                              </button>
                            </div>
                          </td>
                          <td class="py-3.5 px-3">
                            <div class="flex flex-wrap gap-1.5">
                              ${r.status !== 'active' ? `
                                <button type="button" onclick="setRestaurantStatus('${r.id}', 'active')" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold">
                                  ${isAr ? 'تفعيل التشغيل' : 'Activate'}
                                </button>
                              ` : `
                                <button type="button" onclick="setRestaurantStatus('${r.id}', 'suspended')" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">
                                  ${isAr ? 'إيقاف التشغيل' : 'Suspend'}
                                </button>
                              `}
                            </div>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="grid lg:grid-cols-2 gap-6">
              <form onsubmit="savePlatformPricingAndBank(event)" class="bg-white dark:bg-qatar-stoneCard border border-stone-200 dark:border-stone-800 rounded-3xl p-6 shadow-sm space-y-4">
                <h3 class="font-display font-bold text-lg border-b border-stone-100 dark:border-stone-800 pb-3">
                  ${isAr ? 'تعديل أسعار الباقتين وبيانات التحويل البنكي' : 'Edit Two Plan Prices & Bank Details'}
                </h3>

                <div class="grid grid-cols-2 gap-3">
                  ${appState.platformSettings.plans.map(p => `
                    <div>
                      <label class="block text-xs font-semibold mb-1">${isAr ? p.nameAr : p.nameEn}</label>
                      <input type="number" id="plan-price-${p.id}" value="${p.price}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-sm font-latin font-bold" />
                    </div>
                  `).join('')}
                </div>

                <div>
                  <label class="block text-xs font-semibold mb-1">${isAr ? 'اسم البنك في قطر' : 'Bank Name'}</label>
                  <input type="text" id="owner-bank-name" value="${appState.platformSettings.bankName}" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-xs" />
                </div>

                <div>
                  <label class="block text-xs font-semibold mb-1">IBAN</label>
                  <input type="text" id="owner-bank-iban" value="${appState.platformSettings.iban}" dir="ltr" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-xs font-latin" />
                </div>

                <div>
                  <label class="block text-xs font-semibold mb-1">${isAr ? 'رقم واتساب تأكيد التحويلات' : 'WhatsApp Support'}</label>
                  <input type="text" id="owner-whatsapp" value="${appState.platformSettings.whatsappSupport}" dir="ltr" class="w-full px-3 py-2 rounded-xl border border-stone-300 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 text-xs font-latin" />
                </div>

                <button type="submit" class="w-full py-2.5 rounded-xl bg-qatar-maroon text-white font-bold text-xs shadow">
                  ${isAr ? 'حفظ وتحديث الأسعار في صفحة الهبوط' : 'Save & Update Landing Page'}
                </button>
              </form>

              <div class="bg-white dark:bg-qatar-stoneCard border border-stone-200 dark:border-stone-800 rounded-3xl p-6 shadow-sm space-y-5">
                <h3 class="font-display font-bold text-lg border-b border-stone-100 dark:border-stone-800 pb-3">
                  ${isAr ? 'النسخ الاحتياطي وملفات المشروع (VS Code & Cloud)' : 'Real Backups & Project Source Files'}
                </h3>

                <div class="p-4 rounded-2xl bg-stone-50 dark:bg-stone-900 border border-stone-200 dark:border-stone-800 space-y-3">
                  <div class="font-bold text-sm">${isAr ? '1. النسخ الاحتياطي الكامل لبيانات المنصة (JSON)' : '1. Full Platform Data Backup (JSON)'}</div>
                  <p class="text-xs text-stone-500">${isAr ? 'احفظ نسخة احتياطية كاملة من جميع المطاعم، المنيوهات، الطلبات، والأسعار على جهازك قبل أي تعديل.' : 'Download a full backup of all tenants, menus, orders, and pricing before making changes.'}</p>
                  <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="downloadFullBackup()" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold shadow-sm">
                      💾 ${isAr ? 'تنزيل نسخة احتياطية الآن' : 'Download Backup Now'}
                    </button>
                    <button type="button" onclick="openCloudSyncModal()" class="px-4 py-2 rounded-xl bg-sky-700 hover:bg-sky-800 text-white text-xs font-bold shadow-sm">☁️ ${isAr ? 'ربط قاعدة البيانات السحابية' : 'Cloud DB Sync'}</button>
                    <input type="file" id="restore-backup-input" accept=".json" onchange="restoreFullBackup(event)" class="hidden" />
                    <button type="button" onclick="document.getElementById('restore-backup-input').click()" class="px-4 py-2 rounded-xl border border-stone-300 dark:border-stone-700 text-xs font-semibold hover:bg-stone-200 dark:hover:bg-stone-800">
                      ♻️ ${isAr ? 'استعادة من نسخة احتياطية' : 'Restore from Backup'}
                    </button>
                  </div>
                </div>

                <div class="p-4 rounded-2xl bg-stone-900 text-stone-100 space-y-3">
                  <div class="font-bold text-sm text-amber-400">${isAr ? '2. تنزيل ملفات المشروع لفتحها في VS Code والنشر السحابي' : '2. Download Project Files for VS Code & Cloud Deploy'}</div>
                  <p class="text-xs text-stone-300 leading-relaxed">
                    ${isAr
                      ? 'قم بتنزيل ملف التطبيق الكامل (index.html) وملف دليل النشر السحابي (README.md) لتفتحهما مباشرة في محرر VS Code أو ترفعهما على Cloudflare Pages / Netlify / Vercel.'
                      : 'Download the complete self-contained index.html and deployment guide README.md to edit in VS Code or deploy to Cloudflare Pages / Netlify / Vercel.'}
                  </p>
                  <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="downloadProjectSourceHTML()" class="px-4 py-2 rounded-xl bg-qatar-maroon hover:bg-qatar-maroonLight text-white text-xs font-bold shadow">
                      📦 ${isAr ? 'تنزيل ملف الكود الكامل (index.html)' : 'Download index.html'}
                    </button>
                    <button type="button" onclick="downloadProjectReadme()" class="px-4 py-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-200 text-xs font-semibold border border-stone-700">
                      📄 ${isAr ? 'تنزيل دليل النشر السحابي (README.md)' : 'Download README.md'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function handleOwnerLogin(e) {
      e.preventDefault();
      const val = document.getElementById('owner-pass-input').value.trim();
      if (val === appState.ownerPassword) {
        sessionState.ownerAuthenticated = true;
        renderApp();
      } else {
        showToast(appState.lang === 'ar' ? 'كلمة مرور المالك غير صحيحة' : 'Invalid owner password', 'error');
      }
    }

    function setRestaurantStatus(restId, status) {
      const rest = appState.restaurants.find(r => r.id === restId);
      if (!rest) return;
      rest.status = status;
      saveAppState();
      showToast(
        appState.lang === 'ar'
          ? (status === 'active' ? `تم تفعيل تشغيل (${rest.nameAr}) بنجاح!` : `تم إيقاف تشغيل (${rest.nameAr}) وحجبه فوراً!`)
          : 'Restaurant status updated',
        status === 'active' ? 'success' : 'info'
      );
      renderApp();
    }

    function changeRestaurantPlan(restId, planId) {
      const rest = appState.restaurants.find(r => r.id === restId);
      if (!rest) return;
      rest.planId = planId;
      const plan = getRestaurantPlan(rest);
      if (rest.tablesCount > plan.maxTables) {
        rest.tablesCount = plan.maxTables;
      }
      saveAppState();
      showToast(
        appState.lang === 'ar'
          ? `تم تحديث باقة المطعم إلى (${plan.nameAr}) — حد الطاولات: ${plan.maxTables}`
          : `Plan updated to ${plan.nameEn}`,
        'success'
      );
      renderApp();
    }

    function savePlatformPricingAndBank(e) {
      e.preventDefault();
      appState.platformSettings.plans.forEach(p => {
        const el = document.getElementById(`plan-price-${p.id}`);
        if (el) p.price = parseFloat(el.value) || p.price;
      });
      appState.platformSettings.bankName = document.getElementById('owner-bank-name').value.trim();
      appState.platformSettings.iban = document.getElementById('owner-bank-iban').value.trim();
      appState.platformSettings.whatsappSupport = document.getElementById('owner-whatsapp').value.trim();
      saveAppState();
      showToast(appState.lang === 'ar' ? 'تم حفظ الأسعار وبيانات البنك وتحديث المنصة!' : 'Pricing & bank details updated!', 'success');
      renderApp();
    }

    function downloadFullBackup() {
      const backupPayload = {
        exportedAt: new Date().toISOString(),
        platform: 'Diyafa QA SaaS',
        data: appState
      };
      const fileName = `diyafa-qa-backup-${new Date().toISOString().split('T')[0]}.json`;
      triggerReliableDownload(fileName, JSON.stringify(backupPayload, null, 2), 'application/json;charset=utf-8');
    }

    function restoreFullBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed && parsed.data && parsed.data.restaurants) {
            appState = parsed.data;
            saveAppState();
            applyThemeAndLang();
            showToast(appState.lang === 'ar' ? 'تمت استعادة النسخة الاحتياطية بنجاح!' : 'Backup restored successfully!', 'success');
            renderApp();
          } else {
            showToast('ملف النسخة الاحتياطية غير صالح.', 'error');
          }
        } catch (err) {
          showToast('تعذر قراءة ملف النسخة الاحتياطية.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function downloadProjectSourceHTML() {
      const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      triggerReliableDownload('index.html', fullHtml, 'text/html;charset=utf-8');
    }

    function downloadProjectReadme() {
      const readme = `# منصة ضيافة QA (Diyafa QA SaaS)\n\n## هيكل المشروع\n- \`index.html\`: التطبيق الكامل (صفحة الهبوط، صفحة العملاء المعزولة لكل مطعم، لوحة الموظفين، ولوحة تحكم المالك).\n\n## التشغيل والتعديل في VS Code\n1. افتح المجلد الذي يحتوي على \`index.html\` داخل برنامج VS Code.\n2. يمكنك تشغيله مباشرة عبر إضافة Live Server أو فتحه في المتصفح.\n\n## النشر السحابي الفوري (Cloud Deployment)\n- **Cloudflare Pages / Netlify / Vercel**: ارفع ملف \`index.html\` مباشرة وستعمل جميع المسارات المعزولة فوراً.\n`;
      triggerReliableDownload('README.md', readme, 'text/markdown;charset=utf-8');
    }

    function openModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      content.innerHTML = html;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (sessionState.route === 'landing') {
        root.innerHTML = renderLandingPage();
      } else if (sessionState.route === 'customer') {
        root.innerHTML = renderCustomerPage();
      } else if (sessionState.route === 'staff') {
        root.innerHTML = renderStaffPage();
      } else if (sessionState.route === 'owner') {
        root.innerHTML = renderOwnerPage();
      } else {
        root.innerHTML = renderLandingPage();
      }
    }

    window.addEventListener('hashchange', () => {
      parseHashRoute();
      updatePreviewBarActiveState();
      renderApp();
    });

    window.onload = function () {
      applyThemeAndLang();
      parseHashRoute();
      updatePreviewBarActiveState();
      renderApp();
      if (getCloudConfig()) {
        pullStateFromCloud(true);
        setInterval(() => pullStateFromCloud(true), 8000);
      }
    };
  </script>

</body></html>
